<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
@media (max-width:900px){.gpn-links{order:3 !important;flex-basis:100% !important;justify-content:flex-start !important}.gpn-word{display:none !important}}</style>
</helmet>
<header style="font-family:'Figtree',system-ui,sans-serif;color:#0D1B19;background:#fff;border-bottom:1px solid #E6E3DA;width:100%;box-sizing:border-box">
<nav aria-label="Portal" style="max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap">
<a href="Dashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#0D1B19">
<span style="font-family:'Bricolage Grotesque',Georgia,serif;width:34px;height:34px;border-radius:10px;background:#0B6E5F;color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px">G</span>
<span class="gpn-word" style="font-family:'Bricolage Grotesque',Georgia,serif;font-weight:700;font-size:19px">GetHired<span style="color:#0B6E5F">Today</span></span></a>
<div class="gpn-links" style="flex:1 1 0;min-width:0;display:flex;justify-content:center;gap:2px;overflow-x:auto">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
<a href="{{t.href}}" aria-current="{{t.cur}}" style="flex:none;text-decoration:none;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;color:{{t.fg}};background:{{t.bg}}">{{t.label}}</a>
</sc-for>
</div>
<div style="margin-left:auto;display:flex;gap:8px;align-items:center">
<a href="Checkout.dc.html" style="display:flex;gap:6px;align-items:center;text-decoration:none;font-weight:800;font-size:14px;color:#0D1B19;background:#FFD166;padding:10px 14px;border-radius:999px">Go Pro</a>
<a href="Account.dc.html" aria-label="Account" style="width:42px;height:42px;border-radius:50%;background:#0D1B19;color:#fff;display:grid;place-items:center;text-decoration:none;font-weight:700">F</a>
</div>
</nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","resumes","letters","jobs","apps","auto","ats","none"],"default":"home"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'home';
const t = (id, label, href) => ({ label, href, cur: a === id ? 'page' : 'false', fg: a === id ? '#08574B' : '#3F4D49', bg: a === id ? '#DDF3EC' : 'transparent' });
return { tabs: [t('home', 'Home', 'Dashboard.dc.html'), t('resumes', 'Resumes', 'Resumes.dc.html'), t('letters', 'Cover letters', 'CoverLetters.dc.html'), t('jobs', 'Find jobs', 'Jobs.dc.html'), t('apps', 'Applications', 'Applications.dc.html'), t('auto', 'Auto-Apply', 'AutoApply.dc.html'), t('ats', 'ATS check', 'PortalAts.dc.html')] };
}
}
</script>
</body>
</html>
